<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Anon E2E Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; background:#111; color:#eee; }
  #app { display: flex; gap: 16px; }
  #roster-panel { width: 180px; flex-shrink: 0; }
  #roster-panel h3 { font-size: 14px; color: #999; margin: 0 0 8px 0; }
  #roster { border: 1px solid #333; border-radius: 6px; background: #1a1a1a; min-height: 400px; padding: 6px; }
  .roster-entry { display: flex; align-items: center; gap: 6px; padding: 6px 4px; border-bottom: 1px solid #262626; }
  .roster-entry:last-child { border-bottom: none; }
  .roster-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dm-btn { font-size: 12px; padding: 3px 7px; background: #263a4a; color: #7fd1ff; border: 1px solid #35526a; border-radius: 4px; cursor: pointer; }
  .dm-btn:disabled { opacity: 0.4; cursor: default; }
  #main-chat { flex: 1; min-width: 0; }
  #log { border: 1px solid #333; height: 400px; overflow-y: auto; padding: 10px; background:#1a1a1a; border-radius: 6px; }
  .msg { margin: 4px 0; }
  .me { color: #7fd1ff; }
  .sys { color: #888; font-style: italic; }
  input, button { font-size: 15px; padding: 8px; }
  #controls { display: flex; gap: 6px; margin-top: 10px; }
  #text { flex: 1; }
  #status { font-size: 13px; color: #999; margin-bottom: 6px; }
  #profile-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
  #profile-row input { width: 140px; }
  #pfp-picker { display: flex; gap: 4px; }
  #pfp-picker button { font-size: 20px; padding: 4px 8px; background:#222; border:1px solid #333; border-radius:4px; cursor:pointer; }
  #pfp-picker button.selected { border-color: #7fd1ff; }
  #save-profile { padding: 6px 12px; }

  /* Floating DM windows */
  #dm-windows { position: fixed; bottom: 0; right: 20px; display: flex; gap: 10px; align-items: flex-end; z-index: 100; }
  .dm-window { width: 260px; background: #1a1a1a; border: 1px solid #35526a; border-radius: 8px 8px 0 0; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
  .dm-header { background: #263a4a; padding: 8px 10px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .dm-close { cursor: pointer; color: #999; font-size: 16px; line-height: 1; }
  .dm-log { height: 180px; overflow-y: auto; padding: 8px; font-size: 13px; }
  .dm-controls { display: flex; gap: 4px; padding: 6px; border-top: 1px solid #333; }
  .dm-controls input { flex: 1; font-size: 13px; padding: 6px; }
  .dm-controls button { font-size: 13px; padding: 6px 10px; }
</style>
</head>
<body>

<h2>Anonymous E2E Chat</h2>

<div id="profile-row">
  <input id="display-name" placeholder="Your name" maxlength="30" />
  <div id="pfp-picker"></div>
  <button id="save-profile">Save</button>
  <button id="connect-btn" style="display:none;">Connect</button>
</div>

<div id="app">
  <div id="roster-panel">
    <h3>In this room</h3>
    <div id="roster"></div>
  </div>
  <div id="main-chat">
    <div id="status">Set your name and pfp, then hit Save, then Connect.</div>
    <div id="log"></div>
    <div id="controls">
      <input id="text" placeholder="Type a message…" disabled />
      <button id="send" disabled>Send</button>
    </div>
  </div>
</div>

<div id="dm-windows"></div>


<script>
// ---------- STATE (declared first so early UI calls below can use it) ----------
let ws;
let myClientId = null;
let myKeyPair = null;       // my ECDH keypair (private key never leaves the browser)
let myPublicJwk = null;     // my exported public key, safe to share
let roomKey = null;         // the shared AES-GCM CryptoKey used to encrypt/decrypt messages
let roomKeyRaw = null;      // raw bytes of the room key (needed so we can re-encrypt it for new joiners)
const peerPublicKeys = new Map(); // clientId -> CryptoKey (their public key)
const peerProfiles = new Map();   // clientId -> { name, pfp }
const dmWindows = new Map();      // clientId -> { el, logEl }
const rosterEl = document.getElementById('roster');
const dmWindowsEl = document.getElementById('dm-windows');

const PFP_OPTIONS = ['👤','🐱','🐶','🦊','🐼','🐸','👻','🤖','🌵','🍕'];
let myProfile = { name: 'Anonymous', pfp: '👤' };

const nameInput = document.getElementById('display-name');
const pfpPicker = document.getElementById('pfp-picker');
const saveProfileBtn = document.getElementById('save-profile');
const connectBtn = document.getElementById('connect-btn');

function renderPfpPicker() {
  pfpPicker.innerHTML = '';
  for (const emoji of PFP_OPTIONS) {
    const btn = document.createElement('button');
    btn.textContent = emoji;
    if (emoji === myProfile.pfp) btn.classList.add('selected');
    btn.addEventListener('click', () => {
      myProfile.pfp = emoji;
      renderPfpPicker();
    });
    pfpPicker.appendChild(btn);
  }
}

async function loadProfile() {
  try {
    const res = await fetch('/profile', { credentials: 'same-origin' });
    myProfile = await res.json();
  } catch (e) { /* keep defaults */ }
  nameInput.value = myProfile.name;
  renderPfpPicker();
}

async function saveProfile() {
  myProfile.name = nameInput.value.trim() || 'Anonymous';
  await fetch('/profile', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(myProfile)
  });

  if (ws && ws.readyState === WebSocket.OPEN) {
    // Already connected — push the change out live instead of making
    // everyone wait for a reconnect to see the new name/pfp.
    ws.send(JSON.stringify({ type: 'profile-update' }));
  } else {
    // Not connected yet — this is the first save, so reveal Connect.
    connectBtn.style.display = 'inline-block';
    statusEl.textContent = 'Ready — click Connect to join the chat.';
  }
}
saveProfileBtn.addEventListener('click', saveProfile);
connectBtn.addEventListener('click', () => {
  connectBtn.disabled = true;
  saveProfileBtn.disabled = true;
  nameInput.disabled = true;
  connectToChat();
});
loadProfile();
renderRoster();
// ---------- CONFIG ----------
// Room name comes straight from the URL, e.g. chat.html#kitchen
const room = location.hash ? location.hash.slice(1) : 'lobby';

// This server serves the page AND the WebSocket from the same address,
// so just connect back to wherever this page was loaded from.
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const textEl = document.getElementById('text');
const sendBtn = document.getElementById('send');

function log(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + (cls || '');
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

// ---------- CRYPTO HELPERS ----------

async function generateMyKeyPair() {
  myKeyPair = await crypto.subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' },
    true, // extractable (we need to export the PUBLIC half to share it)
    ['deriveKey', 'deriveBits']
  );
  myPublicJwk = await crypto.subtle.exportKey('jwk', myKeyPair.publicKey);
}

async function importPeerPublicKey(jwk) {
  return crypto.subtle.importKey(
    'jwk', jwk,
    { name: 'ECDH', namedCurve: 'P-256' },
    true, []
  );
}

// Derive a one-off AES-GCM key shared between me and one specific peer.
// Because ECDH is symmetric, both sides compute the exact same key
// without ever sending it over the wire.
async function derivePairwiseKey(peerPublicKey) {
  return crypto.subtle.deriveKey(
    { name: 'ECDH', public: peerPublicKey },
    myKeyPair.privateKey,
    { name: 'AES-GCM', length: 256 },
    true,
    ['encrypt', 'decrypt']
  );
}

async function generateRoomKey() {
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  const raw = await crypto.subtle.exportKey('raw', key);
  return { key, raw };
}

function bufToB64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function b64ToBuf(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
}

async function encryptWithKey(key, plaintext) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext));
  return { iv: bufToB64(iv), ciphertext: bufToB64(ciphertext) };
}

async function decryptWithKey(key, ivB64, ciphertextB64) {
  const iv = new Uint8Array(b64ToBuf(ivB64));
  const plaintextBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, b64ToBuf(ciphertextB64));
  return new TextDecoder().decode(plaintextBuf);
}

// ---------- MESSAGE HANDLING ----------

async function handleServerMessage(msg) {
  switch (msg.type) {

    case 'welcome': {
      myClientId = msg.clientId;
      // Draw the roster of everyone already in the room
      for (const entry of (msg.roster || [])) {
        peerProfiles.set(entry.clientId, entry.profile || { name: 'Anonymous', pfp: '👤' });
      }
      renderRoster();

      // Announce our public key to the room
      ws.send(JSON.stringify({ type: 'pubkey', key: myPublicJwk }));

      // If nobody sends us a room key within 1.5s, assume we're first
      // and mint a new one ourselves.
      setTimeout(async () => {
        if (!roomKey) {
          const { key, raw } = await generateRoomKey();
          roomKey = key;
          roomKeyRaw = raw;
          statusEl.textContent = `Connected to "${room}" — you started this room's encryption.`;
          enableInput();
        }
      }, 1500);
      break;
    }

    case 'pubkey': {
      const pubKey = await importPeerPublicKey(msg.key);
      peerPublicKeys.set(msg.clientId, pubKey);
      renderRoster(); // a DM button can now be enabled for this person

      // If we already hold the room key, hand it to the new peer,
      // encrypted so only they can open it.
      if (roomKey && roomKeyRaw) {
        const pairwiseKey = await derivePairwiseKey(pubKey);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, pairwiseKey, roomKeyRaw);
        ws.send(JSON.stringify({
          type: 'room-key',
          to: msg.clientId,
          iv: bufToB64(iv),
          ciphertext: bufToB64(ciphertext)
        }));
      }
      break;
    }

    case 'room-key': {
      if (msg.to !== myClientId) return; // not addressed to us
      const senderPub = peerPublicKeys.get(msg.clientId);
      if (!senderPub) return; // haven't seen their pubkey yet, shouldn't normally happen
      const pairwiseKey = await derivePairwiseKey(senderPub);
      const iv = new Uint8Array(b64ToBuf(msg.iv));
      roomKeyRaw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, pairwiseKey, b64ToBuf(msg.ciphertext));
      roomKey = await crypto.subtle.importKey('raw', roomKeyRaw, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
      statusEl.textContent = `Connected to "${room}" — encryption key received.`;
      enableInput();
      break;
    }

    case 'chat': {
      if (!roomKey) return; // can't decrypt yet
      try {
        const text = await decryptWithKey(roomKey, msg.iv, msg.ciphertext);
        const p = msg.profile || { name: 'Anonymous', pfp: '👤' };
        log(`${p.pfp} ${p.name}: ${text}`);
      } catch (e) {
        log('[a message failed to decrypt]', 'sys');
      }
      break;
    }

    case 'dm': {
      const senderPub = peerPublicKeys.get(msg.clientId);
      if (!senderPub) return; // can't decrypt without their public key yet
      try {
        const pairwiseKey = await derivePairwiseKey(senderPub);
        const text = await decryptWithKey(pairwiseKey, msg.iv, msg.ciphertext);
        const win = openDmWindow(msg.clientId, msg.profile);
        appendDmLine(win, `${msg.profile.pfp} ${msg.profile.name}: ${text}`);
      } catch (e) {
        console.error('DM failed to decrypt', e);
      }
      break;
    }

    case 'peer-profile': {
      peerProfiles.set(msg.clientId, msg.profile);
      renderRoster();
      break;
    }

    case 'peer-joined':
      peerProfiles.set(msg.clientId, msg.profile || { name: 'Anonymous', pfp: '👤' });
      renderRoster();
      log(`${(msg.profile && msg.profile.name) || 'someone'} joined the room`, 'sys');
      // Re-announce our public key so the new person actually receives it —
      // they weren't in the room yet when we first sent it on our own join.
      ws.send(JSON.stringify({ type: 'pubkey', key: myPublicJwk }));
      break;

    case 'peer-left': {
      const p = peerProfiles.get(msg.clientId);
      log(`${(p && p.name) || 'someone'} left the room`, 'sys');
      peerProfiles.delete(msg.clientId);
      peerPublicKeys.delete(msg.clientId);
      renderRoster();
      break;
    }
  }
}

function enableInput() {
  textEl.disabled = false;
  sendBtn.disabled = false;
}

// ---------- ROSTER ----------

function renderRoster() {
  rosterEl.innerHTML = '';
  if (peerProfiles.size === 0) {
    rosterEl.innerHTML = '<div style="color:#666; font-size:13px; padding:6px;">No one else here yet</div>';
    return;
  }
  for (const [clientId, profile] of peerProfiles) {
    const row = document.createElement('div');
    row.className = 'roster-entry';

    const label = document.createElement('div');
    label.className = 'roster-name';
    label.textContent = `${profile.pfp} ${profile.name}`;
    row.appendChild(label);

    const dmBtn = document.createElement('button');
    dmBtn.className = 'dm-btn';
    dmBtn.textContent = 'DM';
    const hasKey = peerPublicKeys.has(clientId);
    dmBtn.disabled = !hasKey;
    dmBtn.title = hasKey ? '' : 'Waiting for their key…';
    dmBtn.addEventListener('click', () => openDmWindow(clientId, profile));
    row.appendChild(dmBtn);

    rosterEl.appendChild(row);
  }
}

// ---------- DIRECT MESSAGES ----------

function openDmWindow(clientId, profile) {
  if (dmWindows.has(clientId)) return dmWindows.get(clientId);

  const win = document.createElement('div');
  win.className = 'dm-window';
  win.innerHTML = `
    <div class="dm-header">
      <span>${profile.pfp} ${profile.name}</span>
      <span class="dm-close">✕</span>
    </div>
    <div class="dm-log"></div>
    <div class="dm-controls">
      <input placeholder="Message…" />
      <button>Send</button>
    </div>
  `;
  dmWindowsEl.appendChild(win);

  const logEl = win.querySelector('.dm-log');
  const inputEl = win.querySelector('input');
  const sendBtnEl = win.querySelector('.dm-controls button');
  const closeEl = win.querySelector('.dm-close');

  const entry = { el: win, logEl };
  dmWindows.set(clientId, entry);

  const doSend = () => sendDm(clientId, inputEl, logEl);
  sendBtnEl.addEventListener('click', doSend);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSend(); });
  closeEl.addEventListener('click', () => {
    win.remove();
    dmWindows.delete(clientId);
  });

  return entry;
}

function appendDmLine(win, text) {
  const line = document.createElement('div');
  line.textContent = text;
  win.logEl.appendChild(line);
  win.logEl.scrollTop = win.logEl.scrollHeight;
}

async function sendDm(clientId, inputEl, logEl) {
  const text = inputEl.value.trim();
  if (!text) return;
  const pubKey = peerPublicKeys.get(clientId);
  if (!pubKey) return;
  const pairwiseKey = await derivePairwiseKey(pubKey);
  const { iv, ciphertext } = await encryptWithKey(pairwiseKey, text);
  ws.send(JSON.stringify({ type: 'dm', to: clientId, iv, ciphertext }));
  const line = document.createElement('div');
  line.className = 'me';
  line.textContent = `${myProfile.pfp} you: ${text}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  inputEl.value = '';
}

// ---------- SEND ----------

async function sendMessage() {
  const text = textEl.value.trim();
  if (!text || !roomKey) return;
  const { iv, ciphertext } = await encryptWithKey(roomKey, text);
  ws.send(JSON.stringify({ type: 'chat', iv, ciphertext }));
  log(`${myProfile.pfp} ${myProfile.name} (you): ${text}`, 'me');
  textEl.value = '';
}

sendBtn.addEventListener('click', sendMessage);
textEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

// ---------- CONNECT (only runs once the user clicks Connect) ----------

async function connectToChat() {
  statusEl.textContent = 'Connecting…';
  await generateMyKeyPair();
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    statusEl.textContent = 'Connected — exchanging keys…';
    ws.send(JSON.stringify({ type: 'join', room }));
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    handleServerMessage(msg);
  };

  ws.onclose = () => { statusEl.textContent = 'Disconnected.'; };
  ws.onerror = () => { statusEl.textContent = 'Connection error.'; };
}
</script>
</body>
</html>
